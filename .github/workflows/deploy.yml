# Builds the word lists from the dictionary and deploys the website to GitHub Pages.
# This file is the same in BNDnamegenerator and nsanamegenerator except for name and schedule.
name: Deploy BNDnamegenerator

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Picks up dictionary updates
  schedule:
    - cron: '17 3 * * *'  # every day at 3:17am (not on the hour, when GitHub may skip scheduled runs)

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt

      - name: Run tests
        if: hashFiles('test_*.py') != ''
        run: python -m unittest -v

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # The words are generated at most once a day, and again as soon as a Python file changes
      - name: Restore cached words
        id: cache-words-restore
        uses: actions/cache/restore@v5
        with:
          path: './website/words'
          key: cache-words-${{ steps.date.outputs.date }}-${{ hashFiles('*.py', 'requirements.txt') }}

      - name: Generate words
        if: steps.cache-words-restore.outputs.cache-hit != 'true'
        run: python generateWords.py

      - name: Save words
        if: steps.cache-words-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: './website/words'
          key: ${{ steps.cache-words-restore.outputs.cache-primary-key }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
