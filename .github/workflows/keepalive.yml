# GitHub disables scheduled workflows in public repositories after 60 days without
# any commit. If the repository has been quiet for a while, commit a timestamp so
# the scheduled dictionary update keeps running.
name: Keepalive

on:
  schedule:
    - cron: '30 4 * * 1'  # every Monday at 4:30am

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit timestamp if there was no commit for 30 days
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Last commit was $days days ago"
          if [ "$days" -lt 30 ]; then
            exit 0
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -m 'Keep scheduled workflows alive'
          git push
