<!DOCTYPE html>
<html>
<head>
<title>BND Name Generator</title>
<script src="random.js"></script>
<style>
.text {
	text-align: center;
	padding-top: 200px;
	font-weight: bold;
	font-size: 60pt;
	font-family: Arial, sans-serif;
	text-decoration: none;
	color: black;
	word-break: break-all;
}
</style>
</head>
<body>
<p class="text" id="text"></p>
<script>
async function run () {
 // the first word already ends with its linking element (Sonne -> Sonnen), see fugen.py
 let w1 = await random('bestimmungswort');
 let w2 = await random('nsgu');
 document.getElementById("text").innerText = (w1 + w2).toUpperCase();
 document.title = 'BND Name Generator - '+ w1 +' + '+ w2;
}
run()
</script>
</body>
</html>
